name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not attach or paste private data**: no personal
        notes or exported note files, no note titles or contents, no screenshots
        that show personal notes, no tokens, cookies, authorization codes, signed
        download URLs, account e-mails or ids, SQLite files or session folders.
        Describe notes by structure only (e.g. "handwritten note, 3 pages, one PDF
        page, one picture inserted on a phone"); see CONTRIBUTING.md, "Reporting a
        note the client refuses". Redact logs before pasting them.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, expected and actual behaviour.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sign-in / session
        - Sync (download)
        - Upload / Cloud write
        - Text / rich text editor
        - Ink (pen, eraser, lasso)
        - Pages / PDF / templates
        - Previews / thumbnails
        - Folders / favorites / trash
        - Packaging (AppImage, deb, rpm, Flatpak)
        - Other
    validations:
      required: true
  - type: dropdown
    id: write
    attributes:
      label: Did a Cloud write have an unclear outcome?
      description: If an upload's result was unknown, do NOT retry it manually; say so here.
      options:
        - "No"
        - "Yes - result unknown, not retried"
        - "Yes - I retried"
  - type: input
    id: version
    attributes:
      label: Version
      description: From the downloaded file name (e.g. 0.0.1-alpha), or the commit if built from source.
      placeholder: e.g. 0.0.1-alpha
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package type
      options:
        - AppImage
        - .deb
        - .rpm
        - Flatpak
        - macOS .dmg (Apple silicon)
        - macOS .dmg (Intel)
        - Built from source
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Distribution / macOS version and desktop
      placeholder: e.g. Fedora 43, GNOME 49, Wayland — or macOS 15.4
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options:
        - Default (pure Rust notes-engine)
        - Embedded engine (in-process, macOS / embedded-engine builds)
        - Not sure
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      render: text
