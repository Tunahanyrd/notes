# Static analysis with Semgrep and pinned community rules.
#
# Semgrep itself is installed from a hash-pinned requirements file
# (security/semgrep-requirements.txt, resolved for CPython 3.12); the rule
# archives are pinned by commit and SHA-256 in security/rules.lock.json and
# verified by tools/semgrep.sh before use. The gate fails only on
# ERROR-severity findings in shipped product code; the full report (all
# severities, whole tree) is uploaded as an artifact and never fails the job.
# Semgrep runs with metrics and version checks off: nothing is sent anywhere.
# Every action is pinned to a full commit SHA (version in the trailing comment).
name: Semgrep

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    name: Semgrep (pinned rules)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Venv and rule cache live outside the checkout so the scan never sees them.
    # (the runner context is not available in job-level env; set in a step)
    env:
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Paths
        run: |
          echo "SEMGREP=$RUNNER_TEMP/semgrep-venv/bin/semgrep" >> "$GITHUB_ENV"
          echo "SEMGREP_CACHE=$RUNNER_TEMP/semgrep-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Restore pinned rule archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/semgrep-cache/archives
          key: semgrep-rules-${{ hashFiles('security/rules.lock.json') }}
      - name: Install Semgrep (hash-pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir \
            --require-hashes --no-deps --only-binary=:all: -r security/semgrep-requirements.txt
          "$SEMGREP" --version
      - name: Gate (ERROR findings in product code)
        run: tools/semgrep.sh gate
      - name: Full report (non-blocking)
        if: always()
        run: tools/semgrep.sh report target/semgrep/report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-report
          path: target/semgrep/report.json
          if-no-files-found: ignore
          retention-days: 14
