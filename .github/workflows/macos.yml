# macOS port CI (Apple Silicon, macos-26) plus a Linux parity job that
# cross-checks the same code for aarch64-apple-darwin. See docs/MACOS_PORT.md.
#
# Actions are pinned to the same commit SHAs as ci.yml. Nothing here talks to
# Samsung: the engine runs --offline against the committed synthetic library
# (crates/notes-engine/conformance/golden/library), and every XDG directory
# points into $RUNNER_TEMP so no job reads a real library or session. The
# authoritative byte-for-byte conformance gate is the Linux job in ci.yml;
# the macOS conformance step is informational until it has passed once.
#
# When called by release.yml (workflow_call with `version`), the test jobs are
# skipped (`if: !inputs.version`) and only `bundle` + `dmg` run.
#
# Cost note: macOS minutes are billed at a multiple of Linux minutes on
# private repositories; the jobs below are split so a failure stops early.
name: macOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Release hook (.github/workflows/release.yml `macos` job): only the dmg
  # jobs run, in release mode, and the disk images are uploaded as exactly
  # one artifact named `macos-dmg`.
  workflow_call:
    inputs:
      version:
        description: Release version without the leading v (e.g. 1.2.3)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '24'
  SDOCX_COMMIT: 41e9c1099b29a48dc7320501573d7c4858f09303
  SDOCX_URL: https://github.com/twangodev/sdocx.git
  BREW_RUNTIME: poppler librsvg imagemagick openssl@3
  # notes-* crates: the pure engine and its platform layer.
  ENGINE_CRATES: -p notes-platform -p notes-net -p notes-login -p notes-cloud -p notes-host -p notes-preview -p notes-engine

jobs:
  rust:
    name: macOS engine (cargo test + offline smoke)
    if: ${{ !inputs.version }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Homebrew runtime tools
        run: brew install $BREW_RUNTIME
      - name: Isolate XDG directories
        run: |
          for d in state config data cache; do mkdir -p "$RUNNER_TEMP/xdg/$d"; done
          {
            echo "XDG_STATE_HOME=$RUNNER_TEMP/xdg/state"
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/xdg/config"
            echo "XDG_DATA_HOME=$RUNNER_TEMP/xdg/data"
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/xdg/cache"
            echo "OPENSSL_DIR=$(brew --prefix openssl@3)"
          } >> "$GITHUB_ENV"
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos-engine
      - name: Platform layer contract (incl. Seatbelt write test)
        run: cargo test --locked -p notes-platform
      - name: cargo test (notes-* crates)
        run: cargo test --locked $ENGINE_CRATES
      - name: cargo test (rs-* crates, PyO3 port cores)
        # Informational until the first green run on macOS: the rs-* unit
        # tests were written on Linux.
        continue-on-error: true
        run: cargo test --locked --workspace --exclude notes-cli $(for c in $ENGINE_CRATES; do [ "$c" = -p ] || printf -- '--exclude %s ' "$c"; done)
      - name: Build notes-engine
        run: cargo build --locked -p notes-engine
      - name: Offline smoke test (synthetic library, no network)
        run: |
          set -euo pipefail
          data=crates/notes-engine/conformance/golden/library/main
          mkdir -p "$RUNNER_TEMP/smoke-run" && chmod 700 "$RUNNER_TEMP/smoke-run"
          copy="$RUNNER_TEMP/smoke-run/data"; cp -R "$data" "$copy"; chmod -R go-rwx "$copy"
          rt="$RUNNER_TEMP/smoke-run/runtime.json"
          target/debug/notes-engine --offline --no-auto-sync --data-dir "$copy" --port 0 --runtime-file "$rt" --no-browser --frontend-dir desktop/public &
          pid=$!
          for _ in $(seq 1 100); do [ -s "$rt" ] && break; sleep 0.1; done
          port=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["port"])' "$rt")
          token=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["token"])' "$rt")
          code=$(curl -s -o "$RUNNER_TEMP/smoke-run/status.json" -w '%{http_code}' -H "Authorization: Bearer $token" "http://127.0.0.1:$port/api/status")
          kill "$pid"; wait "$pid" || true
          echo "GET /api/status -> $code"
          test "$code" = 200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes-engine-macos-debug
          path: target/debug/notes-engine
          retention-days: 3

  conformance:
    name: macOS HTTP conformance (informational)
    if: ${{ !inputs.version }}
    needs: rust
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Homebrew runtime tools
        run: |
          brew install $BREW_RUNTIME
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          # The harness looks tools up on PATH (bwrap/xdg-user-dir do not exist on macOS).
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Cache sdocx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: references/upstream/sdocx
          key: sdocx-${{ env.SDOCX_COMMIT }}
      - name: Fetch sdocx at the pinned commit
        run: |
          if [ -x tools/fetch_sdocx.sh ]; then tools/fetch_sdocx.sh; else
            if [ ! -d references/upstream/sdocx/.git ]; then git clone --filter=blob:none "$SDOCX_URL" references/upstream/sdocx; fi
            git -C references/upstream/sdocx checkout --detach "$SDOCX_COMMIT"
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos-conformance
          workspaces: |
            . -> target
            tools/ink-renderer -> target
      - name: Build ink-render
        run: cargo build --locked --release --manifest-path tools/ink-renderer/Cargo.toml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes-engine-macos-debug
          path: target/debug/
      - name: Replay the golden fixtures against notes-engine
        # Goldens were recorded on Linux from the historical Python reference
        # (Python is not run here). macOS has no bwrap/xdg-user-dir, so the
        # routes using them are expected to differ: informational only.
        run: |
          chmod +x target/debug/notes-engine
          python3 crates/notes-engine/conformance/run.py --replay \
            --candidate target/debug/notes-engine \
            --report "$RUNNER_TEMP/conformance-report-macos.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-report-macos
          path: ${{ runner.temp }}/conformance-report-macos.json
          if-no-files-found: ignore
          retention-days: 14

  desktop:
    name: macOS UI (tsc + Playwright Chromium/WebKit)
    if: ${{ !inputs.version }}
    runs-on: macos-26
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build (tsc -b && vite build)
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install chromium webkit
      - name: Playwright (Chromium, same suite as Linux)
        run: npx playwright test
      - name: Playwright (WebKit, closest to WKWebView; informational)
        continue-on-error: true
        run: npx playwright test -c playwright.webkit.config.ts
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-macos
          path: desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7

  bundle:
    name: macOS .dmg (${{ matrix.arch }}, unsigned)
    runs-on: ${{ matrix.runner }}
    # x86_64 runs on GitHub's Intel macOS image; it is optional so a missing or
    # retired Intel runner never blocks the arm64 disk image.
    continue-on-error: ${{ matrix.arch == 'x86_64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    env:
      APP_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Homebrew tools
        run: brew install $BREW_RUNTIME
      - name: Rust toolchain (+ wasm32-unknown-unknown for ink-live.wasm)
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: Cache sdocx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: references/upstream/sdocx
          key: sdocx-${{ env.SDOCX_COMMIT }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos-bundle-${{ matrix.arch }}
          workspaces: |
            desktop/src-tauri -> target
            tools/ink-renderer -> target
            crates/notes-ink-live -> target
      - name: Build the unsigned .dmg (embedded engine, ink-live.wasm, free icons, static OpenSSL/SQLite)
        # Release mode: optimized build with the release version. CI mode: debug
        # build with the tauri.conf.json version (faster; same verifications).
        run: |
          args=(--dmg --with-ink-renderer --out "$RUNNER_TEMP/dmg")
          if [ -n "$APP_VERSION" ]; then args+=(--release --version "$APP_VERSION"); fi
          tools/macos/build_app.sh "${args[@]}"
          ls -l "$RUNNER_TEMP/dmg"
      # Signing + notarization stub. Disabled: there is no Apple Developer ID
      # yet and no secret is configured. To enable later (docs/MACOS_PORT.md,
      # "Gatekeeper"): add the repository secrets below, remove `if: false`,
      # and sign the .app before the dmg is created (or re-create the dmg).
      - name: Code signing and notarization (disabled stub)
        if: false
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}                   # base64 Developer ID Application .p12
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}         # "Developer ID Application: NAME (TEAMID)"
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}                     # App Store Connect API key (notarytool)
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}                     # base64 AuthKey_<id>.p8
        run: |
          echo "Not enabled. Outline:"
          echo " 1. import the .p12 into a temporary keychain (security create-keychain/import)"
          echo " 2. codesign --deep --force --options runtime --timestamp --sign \"\$APPLE_SIGNING_IDENTITY\" <app>"
          echo " 3. xcrun notarytool submit <dmg> --key AuthKey.p8 --key-id \$APPLE_API_KEY_ID --issuer \$APPLE_API_ISSUER --wait"
          echo " 4. xcrun stapler staple <dmg>; regenerate the .sha256"
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Unsigned, not notarized (right-click > Open on first launch).
          name: macos-dmg-${{ matrix.arch }}
          path: ${{ runner.temp }}/dmg/
          if-no-files-found: error
          retention-days: 7

  dmg:
    name: macOS disk images (artifact macos-dmg)
    needs: bundle
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-dmg-*
          merge-multiple: true
          path: dmg
      - name: Check images and checksums
        working-directory: dmg
        run: |
          ls -l
          ls ./*-arm64.dmg >/dev/null || { echo "::error::arm64 .dmg missing"; exit 1; }
          ls ./*-x86_64.dmg >/dev/null 2>&1 || echo "::warning::x86_64 .dmg missing (Intel runner failed or unavailable)"
          sha256sum -c ./*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # The release workflow downloads exactly this name.
          name: macos-dmg
          path: dmg/
          if-no-files-found: error
          retention-days: 7

  linux-parity:
    name: Linux parity (notes-* tests + darwin cross-check)
    if: ${{ !inputs.version }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils librsvg2-bin imagemagick bubblewrap xdg-user-dirs \
            libssl-dev libsqlite3-dev pkg-config clang
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Isolate XDG directories
        run: |
          for d in state config data cache; do mkdir -p "$RUNNER_TEMP/xdg/$d"; done
          {
            echo "XDG_STATE_HOME=$RUNNER_TEMP/xdg/state"
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/xdg/config"
            echo "XDG_DATA_HOME=$RUNNER_TEMP/xdg/data"
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/xdg/cache"
          } >> "$GITHUB_ENV"
      - name: Rust toolchain (+ aarch64-apple-darwin std for the cross-check)
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-parity
      - name: cargo test (same notes-* crates as the macOS job)
        run: cargo test --locked $ENGINE_CRATES
      - name: cargo check for aarch64-apple-darwin (workspace + desktop shell)
        run: |
          tools/macos/cross_check.sh --desktop --locked
          CROSS_TARGET=x86_64-apple-darwin tools/macos/cross_check.sh --desktop --locked
