[workspace]
members = ["crates/notes-protocol", "crates/notes-cli", "crates/rs-common", "crates/rs-doc", "crates/rs-editor", "crates/rs-ink", "crates/rs-ops", "crates/rs-render", "crates/rs-store", "crates/rs-cloud", "crates/rs-engine", "crates/rs-auth", "crates/notes-net", "crates/notes-login", "crates/notes-host", "crates/notes-cloud", "crates/notes-preview", "crates/notes-engine", "crates/notes-platform"]
resolver = "2"
# fuzz/ is a separate cargo-fuzz workspace (nightly, own Cargo.lock): docs/FUZZING.md
exclude = ["fuzz"]

[workspace.package]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.95"
publish = false

[workspace.dependencies]
pyo3 = { version = "=0.30.1", features = ["extension-module"] }
base64 = { version = "=0.23.1", default-features = false, features = ["alloc"] }
getrandom = "=0.4.3"
openssl = "=0.10.81"
roxmltree = "=0.21.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.10.9", default-features = false }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
notes-protocol = { path = "crates/notes-protocol" }
