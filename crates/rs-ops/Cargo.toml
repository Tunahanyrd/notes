[package]
name = "rs-ops"
license.workspace = true
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
name = "_ops"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { workspace = true, optional = true }
rs-common = { path = "../rs-common", optional = true }
rs-ink = { path = "../rs-ink" }
rs-doc = { path = "../rs-doc" }
roxmltree = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
base64 = { workspace = true }
libc = "=0.2.191"

[features]
# PyO3 bindings (the historical Python extension `_ops`, see reference/python).
# Off by default: the pure engine and the desktop app never compile pyo3.
python = ["dep:pyo3", "dep:rs-common", "rs-common/python", "rs-ink/python", "rs-doc/python"]
