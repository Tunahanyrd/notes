<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notlar · Giriş tamamlandı</title><style>:root{color-scheme:light dark;--bg:#f3f3f6;--card:#fff;--text:#1f1f24;--muted:#5f6068;--line:#e3e3e8;--accent:#1259c3;--accent-hover:#0e4aa6}@media (prefers-color-scheme:dark){:root{--bg:#1b1b1f;--card:#26262b;--text:#f2f2f5;--muted:#a8a8b2;--line:#38383f;--accent:#4c8dff;--accent-hover:#6aa0ff}}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI","Noto Sans",system-ui,sans-serif;padding:24px}main{width:min(440px,100%);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:32px;box-shadow:0 8px 24px rgba(0,0,0,.08)}.mark{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#f26549,#e04a2f);display:grid;place-items:center;margin-bottom:20px}.mark span{width:18px;height:22px;border-radius:3px;background:#fff;box-shadow:inset 0 -6px 0 rgba(242,101,73,.25)}h1{font-size:22px;font-weight:600;margin:0 0 6px}p{margin:0;color:var(--muted)}a.button{display:flex;justify-content:center;align-items:center;margin:24px 0;padding:12px 16px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600}a.button:hover{background:var(--accent-hover)}a.button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}ol{margin:0;padding:0;list-style:none;counter-reset:step;border-top:1px solid var(--line);padding-top:18px}li{counter-increment:step;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;margin:0 0 12px;color:var(--muted)}li::before{content:counter(step);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--accent);border:1px solid var(--line)}li b{color:var(--text);font-weight:600}small{display:block;margin-top:8px;color:var(--muted);font-size:12px}.ok{width:44px;height:44px;border-radius:50%;background:#1a8f4c;display:grid;place-items:center;margin-bottom:20px}.ok span{width:18px;height:10px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg) translate(1px,-2px)}</style></head><body><main><div class="ok" aria-hidden="true"><span></span></div><h1>Giriş tamamlandı</h1><p>Samsung hesabın Notlar'a bağlandı; notların eşitleniyor.</p><small>Bu sekmeyi kapatıp Notlar'a dönebilirsin.</small></main></body></html>
