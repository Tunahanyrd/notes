[package]
name = "rs-editor"
license.workspace = true
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
name = "_editor"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { workspace = true, optional = true }
rs-common = { path = "../rs-common", optional = true }
rs_doc = { path = "../rs-doc", package = "rs-doc" }
roxmltree = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }

[features]
# PyO3 bindings (the historical Python extension `_editor`, see reference/python).
# Off by default: the pure engine and the desktop app never compile pyo3.
python = ["dep:pyo3", "dep:rs-common", "rs-common/python", "rs_doc/python"]
