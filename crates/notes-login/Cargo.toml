[package]
name = "notes-login"
license.workspace = true
version = "0.1.0"
edition.workspace = true
publish = false

# Pure-Rust Samsung sign-in for the Python-free engine: notes_login start /
# callback dispatch, callback decryption, notes_auth_bridge steps, Cloud
# registration and SessionManager._login orchestration.
[lib]
name = "notes_login"

[dependencies]
notes_net = { path = "../notes-net", package = "notes-net" }
notes_platform = { path = "../notes-platform", package = "notes-platform" }
notes-protocol = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
libc = "=0.2.191"
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib"] }

[dev-dependencies]
openssl = { workspace = true }
