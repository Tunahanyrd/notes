[package]
name = "notes-host"
license.workspace = true
version = "0.1.0"
edition.workspace = true
publish = false

# Pure-Rust glue between the area crates (no PyO3 calls): shared error
# classification, DocumentSnapshot dict form, rs-ops Deps, rs-store Host and
# area facades the engine needs (editor projection, ink projection, ...).
[lib]
name = "notes_host"

[dependencies]
rs_store = { path = "../rs-store", package = "rs-store" }
rs_doc = { path = "../rs-doc", package = "rs-doc" }
rs_ink = { path = "../rs-ink", package = "rs-ink" }
rs_ops = { path = "../rs-ops", package = "rs-ops" }
rs_editor = { path = "../rs-editor", package = "rs-editor" }

[dev-dependencies]
# editor_survey example only (read-only private library copy).
rusqlite = "=0.41.0"
# ink_objects.rs fixture generator only (synthetic PNGs for notes-preview).
rs_render = { path = "../rs-render", package = "rs-render" }
