[package]
name = "linux-notes-desktop"
license = "GPL-3.0-or-later"
version = "0.0.1-alpha"
edition = "2021"
[workspace]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
libc = "0.2"
# Pure-Rust engine. Linux default: the notes-engine binary as a child process
# (LINUX_NOTES_ENGINE=native); LINUX_NOTES_ENGINE=embedded runs it in-process
# (feature below). There is no Python engine.
notes-engine = { path = "../../crates/notes-engine", optional = true }
# Platform seams shared with the engine (data dirs, PDEATHSIG on Linux).
notes-platform = { path = "../../crates/notes-platform" }
# macOS: the pure engine always runs in-process (no Python child, no
# sidecar), with SQLite statically linked. See docs/MACOS_PORT.md.
# Wayland app id: GTK3 takes it from the program name for a window that is not a
# GtkApplicationWindow (tao's), so main() sets it to the bundle identifier.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
notes-engine = { path = "../../crates/notes-engine", features = ["bundled-sqlite"] }
[features]
embedded-engine = ["dep:notes-engine"]
# Distribution packages (AppImage/deb/rpm/Flatpak/AUR), marker only:
# build.rs bakes LINUX_NOTES_DEFAULT_ENGINE=native (the notes-engine binary
# shipped next to this executable; no python3) and never bakes the build
# checkout as the resource root. See packaging/linux/tauri.release.conf.json.
packaged = []
[profile.dev]
debug = 0
[profile.release]
strip = true
lto = false
codegen-units = 16
