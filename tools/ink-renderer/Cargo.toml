[workspace]
[package]
name = "ink-render"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "GPL-3.0-only"
[dependencies]
sdocx = { path = "../../references/upstream/sdocx/crates/sdocx", features = ["render", "serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
# Text-to-path conversion for body text (pinned, same version as sdocx dev/pdf).
usvg = { version = "=0.47.0", default-features = false, features = ["text"] }
[profile.dev]
debug = 0
incremental = false
